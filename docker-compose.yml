services:
  app:
    build: .
    container_name: strava-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      STRAVA_EXPORT_DIR: /data/export
    volumes:
      - ./config.json:/app/config.json:ro
      - ./public:/app/public:ro
      - ${STRAVA_EXPORT_DIR:?set STRAVA_EXPORT_DIR to your unzipped Strava export}:/data/export:ro
